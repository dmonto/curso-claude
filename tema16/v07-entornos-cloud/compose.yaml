services:
  backend-a:
    build: .
    env_file: ../.env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      INSTANCE_ID: replica-a
    restart: unless-stopped
  backend-b:
    build: .
    env_file: ../.env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      INSTANCE_ID: replica-b
    restart: unless-stopped
  gateway:
    build: .
    command: [node, balancer.js]
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      BACKENDS: http://backend-a:3000,http://backend-b:3000
    ports: ["127.0.0.1:3000:3000"]
    healthcheck:
      disable: true
    depends_on:
      backend-a:
        condition: service_healthy
      backend-b:
        condition: service_healthy
