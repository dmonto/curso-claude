name: Validacion
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: npm test
      - run: npm ci --prefix frontend-angular
      - run: npm run build --prefix frontend-angular
